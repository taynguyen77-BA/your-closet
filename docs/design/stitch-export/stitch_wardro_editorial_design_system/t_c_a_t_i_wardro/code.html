<script>
        // Micro-interaction: Filter Chip Toggle
        const filterChips = document.querySelectorAll('section button.flex-shrink-0');
        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary');
                    c.classList.add('border', 'border-outline-variant/30', 'text-on-surface-variant');
                });
                chip.classList.add('bg-primary', 'text-on-primary');
                chip.classList.remove('border', 'border-outline-variant/30', 'text-on-surface-variant');
            });
        });

        // Micro-interaction: Favorite Toggle
        const favButtons = document.querySelectorAll('.group button');
        favButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const icon = btn.querySelector('.material-symbols-outlined');
                const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                
                if (isFilled) {
                    icon.style.fontVariationSettings = "'FILL' 0";
                    btn.classList.remove('text-error');
                } else {
                    icon.style.fontVariationSettings = "'FILL' 1";
                    btn.classList.add('text-error');
                }
            });
        });
    </script>
