<script>
        // Simple logic for drag-down interaction or dismissal
        const sheet = document.querySelector('.bottom-sheet-transition');
        const dismissBtn = document.querySelector('button .material-symbols-outlined[textContent="close"]')?.parentElement || document.querySelector('.absolute.top-6.right-6');
        const overlay = document.querySelector('.absolute.inset-0.bg-black\\/40');
        const deferBtn = document.querySelector('span[textContent="Để sau"]')?.parentElement || document.querySelector('.py-4.text-center');

        function dismissModal() {
            sheet.style.transform = 'translateY(100%)';
            overlay.style.opacity = '0';
            setTimeout(() => {
                // In a real app, this would route back or close the component
                alert('Trình đóng modal được kích hoạt.');
            }, 400);
        }

        if (dismissBtn) dismissBtn.addEventListener('click', dismissModal);
        if (deferBtn) deferBtn.addEventListener('click', dismissModal);
        if (overlay) overlay.addEventListener('click', dismissModal);

        // Prevent click propagation inside the sheet from closing it
        sheet.addEventListener('click', (e) => e.stopPropagation());
    </script>
