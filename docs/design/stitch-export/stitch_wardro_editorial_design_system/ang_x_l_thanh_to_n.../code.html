<style>
        body {
            background-color: #f7f4f0; /* Soft Sand background */
            color: #1a1c1c; /* Espresso primary color */
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            color: #1a1c1c;
        }

        /* Custom Espresso Spinner Animation */
        .spinner-container {
            width: 80px;
            height: 80px;
            position: relative;
        }

        .spinner-ring {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 2px solid #1a1c1c;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #1a1c1c transparent transparent transparent;
        }

        .spinner-ring:nth-child(1) { animation-delay: -0.45s; }
        .spinner-ring:nth-child(2) { animation-delay: -0.3s; }
        .spinner-ring:nth-child(3) { animation-delay: -0.15s; }

        @keyframes lds-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Subtle Fade In Animation for Content */
        .fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating elements for editorial feel */
        .editorial-accent {
            width: 1px;
            height: 60px;
            background-color: #1a1c1c;
            opacity: 0.15;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex flex-col items-center justify-center min-h-screen p-margin-mobile">
<!-- Brand Anchor (Top Center) -->
<div class="fixed top-12 left-0 w-full flex justify-center pointer-events-none">
<h1 class="font-headline-md text-headline-md tracking-tight text-primary">Wardro</h1>
</div>
<!-- Main Processing Canvas -->
<main class="flex flex-col items-center justify-center max-w-md w-full fade-in">
<!-- Custom Animated Spinner -->
<div class="mb-stack-lg relative flex items-center justify-center">
<!-- Decorative circle -->
<div class="absolute w-32 h-32 border border-primary/5 rounded-full"></div>
<div class="spinner-container">
<div class="spinner-ring"></div>
<div class="spinner-ring"></div>
<div class="spinner-ring"></div>
<div class="spinner-ring"></div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4">
<h2 class="font-headline-sm text-headline-sm text-primary tracking-normal">
                Đang xử lý thanh toán...
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80 max-w-[280px] mx-auto leading-relaxed">
                Vui lòng không đóng ứng dụng để đảm bảo giao dịch được hoàn tất an toàn.
            </p>
</div>
<!-- Editorial Accent Line -->
<div class="mt-stack-lg editorial-accent"></div>
<!-- Transaction Info (Minimalist Footer Detail) -->
<div class="mt-8 flex items-center gap-2 text-outline">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest opacity-60">Secure Payment Gateway</span>
</div>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<!-- Minimalist paper texture effect or soft light leak -->
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-fixed-dim/5 blur-[120px]"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simulate a subtle pulsing effect on the text after a few seconds
        document.addEventListener('DOMContentLoaded', () => {
            const headline = document.querySelector('h2');
            let dots = 0;
            
            // Minimalist dot animation
            setInterval(() => {
                dots = (dots + 1) % 4;
                headline.innerText = 'Đang xử lý thanh toán' + '.'.repeat(dots);
            }, 800);

            // Trigger a soft haptic-like visual shift if the user tries to click anything (prevention feedback)
            document.body.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BODY') return;
                const canvas = document.querySelector('main');
                canvas.style.transform = 'scale(0.99)';
                setTimeout(() => {
                    canvas.style.transform = 'scale(1)';
                }, 150);
            });
        });
    </script>
