</div>
</div>
<!-- Phone Number (Verified) -->

<label class="font-label-sm text-on-surface-variant mb-1 uppercase tracking-wider">Số điện thoại</label>

<div class="flex items-center gap-1 text-secondary font-label-sm">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>

</div>
</div>
</div>

<input class="bg-transparent border-none p-0 flex-grow font-body-md text-on-surface" placeholder="name@example.com" type="email" value="hoanganh.wrd@gmail.com"/>
</div>
</div>

<div class="flex flex-col">
<label class="font-label-sm text-on-surface-variant mb-1 uppercase tracking-wider">Ngày sinh</label>
<div class="flex items-center gap-3 py-2 form-underline">

<input class="bg-transparent border-none p-0 w-full font-body-md text-on-surface" placeholder="DD / MM / YYYY" type="text" value="15 / 05 / 1998"/>

</div>

<span class="material-symbols-outlined text-outline">wc</span>
<select class="bg-transparent border-none p-0 w-full font-body-md text-on-surface appearance-none focus:ring-0">
<option selected="">Nam</option>
<option>Nữ</option>
<option>Khác</option>
</select>
</div>
</div>
</div>

<span class="material-symbols-outlined" data-icon="checkroom">checkroom</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container p-2 hover:bg-surface-container-high transition-colors" href="#">

<script>
        // Micro-interaction for inputs
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('focus', () => {
                el.closest('.form-underline').style.borderColor = '#000000';
            });
            el.addEventListener('blur', () => {
                el.closest('.form-underline').style.borderColor = '#cfc5bb';
            });
        });

        // Simple button active state visual
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
    </script>
