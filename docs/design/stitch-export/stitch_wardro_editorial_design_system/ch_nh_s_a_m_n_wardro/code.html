</button>
<h1 class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary tracking-tight">

<button class="font-label-md text-label-md text-primary hover:opacity-70 transition-opacity active:scale-95 transition-transform uppercase tracking-widest font-bold">

        </button>
</header>
<!-- Main Content Canvas -->
<main class="max-w-screen-sm mx-auto px-margin-mobile py-stack-lg pb-24">
<form class="space-y-stack-lg">
<!-- Photo Upload Area -->
<section class="flex flex-col items-center">
<div class="relative group cursor-pointer w-full aspect-[3/4] max-w-[320px] bg-white overflow-hidden rounded-lg shadow-sm">
<img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A high-end editorial fashion photograph of a beige linen blazer for women, styled on a minimalist ghost mannequin. The lighting is soft and natural, emphasizing the organic texture of the linen fabric and the precise tailoring. The background is a clean, off-white linen texture, maintaining a luxurious and airy aesthetic consistent with a premium fashion magazine spread." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKGorniO66nWL60YSPuRbPvdi45voKPHZvWpwOPX96n-H-SkYn2V-8m_fkHxzqGS35tI3AIYP8JPQxzKUk3apgvdzitTk0CpealoInsN2XjflPhT0FpJrQFmZOT_g-nsvi6Z0FG3ZzaD3MLqTsJq1e-aobge977_Edjd5WHcr6RuRs-ToKCvPkWFU1QZj1Qc1MCmJ9GMejEMI6wUAPTTzU94AFAgkdf-rHPQFXvvZ3jf5gEC_6S6GE4LVZn3MtoAI_M_3lsrUxDXM">
<div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<div class="bg-white/90 px-stack-md py-stack-sm rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
<span class="text-label-sm font-bold uppercase">Thay đổi ảnh</span>
</div>
</div>
</div>
<p class="mt-4 text-label-sm text-on-surface-variant/60 uppercase tracking-widest">Xem trước hình ảnh sản phẩm</p>
</section>
<!-- Form Fields -->
<div class="grid grid-cols-1 gap-stack-md">
<!-- Tên món đồ -->
<div class="flex flex-col">

<input class="luxury-input font-headline-sm text-primary" type="text" value="Beige Linen Blazer">
</div>
<!-- Thương hiệu -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Thương hiệu</label>
<input class="luxury-input font-body-lg text-primary italic" type="text" value="The Curated Minimalist">
</div>
<!-- Grid Row for Status and Size -->
<div class="grid grid-cols-2 gap-gutter">
<!-- Tình trạng -->
<div class="flex flex-col relative">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Tình trạng</label>
<select class="luxury-input font-body-md text-primary appearance-none cursor-pointer">
<option>Mới 98%</option>
<option>Mới 100% (Tag)</option>
<option>Tốt (90%)</option>
<option>Đã sử dụng</option>
</select>
<span class="material-symbols-outlined absolute bottom-3 right-0 pointer-events-none text-on-surface-variant/40">expand_more</span>
</div>
<!-- Size -->
<div class="flex flex-col relative">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Size</label>
<select class="luxury-input font-body-md text-primary appearance-none cursor-pointer">
<option>M size</option>
<option>S size</option>
<option>L size</option>
<option>Free size</option>
</select>

</div>
</div>

<div class="grid grid-cols-2 gap-gutter">

</div>
</div>

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 0, &quot;wght&quot; 400, &quot;GRAD&quot; 0, &quot;opsz&quot; 24;">delete</span>
                    Xóa khỏi tủ đồ
                </button>
</div>
</form>
</main>
<!-- Success Feedback Overlay (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-primary text-white px-stack-md py-stack-sm rounded-full shadow-2xl opacity-0 translate-y-4 transition-all duration-500 pointer-events-none flex items-center gap-3" id="save-toast">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-sm uppercase font-bold tracking-widest">Đã lưu thay đổi</span>
</div>
<script>
        // Micro-interactions
        const saveBtn = document.querySelector('header button:last-child');
        const toast = document.getElementById('save-toast');

        saveBtn.addEventListener('click', () => {
            // Simulate save
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        });

        // Simple parallax effect on image scroll
        window.addEventListener('scroll', () => {
            const img = document.querySelector('img');
            const scroll = window.pageYOffset;
            img.style.transform = `translateY(${scroll * 0.05}px)`;
        });

        // Input active state styling
        const inputs = document.querySelectorAll('.luxury-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>

</body></html>
