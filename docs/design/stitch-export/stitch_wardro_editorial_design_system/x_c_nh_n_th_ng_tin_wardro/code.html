<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&amp;family=DM+Serif+Display:ital@0;1&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>

                        "secondary-fixed": "#fcdeba",
                        "inverse-primary": "#d4c4b3",

                        "surface-container-low": "#f3f3f4",
                        "on-error": "#ffffff",
                        "secondary-container": "#f9dbb7",
                        "outline": "#7e766d",
                        "surface-tint": "#695c4f",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface-variant": "#4d463e",
                        "secondary": "#705b3e",
                        "background": "#f9f9f9",

                        "secondary-fixed-dim": "#dfc29f",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#f1e0ce",
                        "surface-container-high": "#e8e8e8",
                        "on-primary-container": "#908273",
                        "primary-container": "#231a0f",

                        "on-background": "#1a1c1c",
                        "on-surface": "#1a1c1c",
                        "surface": "#f9f9f9",
                        "on-tertiary-fixed-variant": "#474744",
                        "on-secondary-fixed-variant": "#574329",
                        "on-primary-fixed": "#231a0f",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#858480",
                        "surface-variant": "#e2e2e2",
                        "on-secondary-fixed": "#281903",
                        "tertiary-fixed": "#e5e2de",
                        "on-secondary-container": "#755f42",
                        "inverse-on-surface": "#f0f1f1",
                        "surface-container": "#eeeeee",
                        "on-tertiary-fixed": "#1c1c1a",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed-variant": "#504538",
                        "inverse-surface": "#2f3131",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "outline-variant": "#cfc5bb",

                    "borderRadius": {

                        "xl": "0.5rem",

                    },
                    "spacing": {
                        "container-max": "1200px",
                        "margin-mobile": "20px",
                        "stack-md": "24px",
                        "stack-lg": "48px",
                        "unit": "4px",
                        "stack-sm": "12px",
                        "gutter": "24px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "label-md": ["DM Sans"],
                        "headline-md": ["DM Serif Display"],
                        "label-sm": ["DM Sans"],
                        "headline-sm": ["DM Serif Display"],
                        "body-md": ["DM Sans"],
                        "body-lg": ["DM Sans"],

                        "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "700"}],

            },

</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Header Section (TopAppBar Influence) -->
<header class="fixed top-0 w-full z-50 bg-surface flex justify-between items-center px-margin-mobile h-16">
<button aria-label="Back" class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform">arrow_back</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-sm text-headline-sm text-primary">Xác nhận thông tin</h1>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Món 1/3</span>
</div>
<button aria-label="Close" class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform">close</button>
</header>
<main class="flex-1 mt-16 pb-32 max-w-lg mx-auto w-full px-margin-mobile">
<!-- Quality Warning Banner -->
<div class="mt-stack-md mb-stack-sm p-3 bg-secondary-container rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-[20px]">light_mode</span>
<p class="font-label-md text-label-md text-on-secondary-container">Ảnh hơi tối, cân nhắc dùng phiên bản đã cải thiện</p>
</div>
<!-- Hero Clothing Photo -->
<div class="relative w-full aspect-[3/4] overflow-hidden rounded bg-surface-variant photo-card-shadow mb-stack-sm border border-outline-variant/10">
<img class="w-full h-full object-cover" data-alt="A studio-quality editorial fashion photograph of a structured beige linen blazer, presented on a clean, soft-white background with professional studio lighting. The lighting is bright and crisp, highlighting the delicate texture of the linen fabric and the precise tailoring of the lapels. The overall aesthetic is minimalist and high-end, evoking a luxury fashion magazine spread with neutral earth tones and a calm, sophisticated atmosphere." id="main-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCSEM9j0cc9Qv5_90nqUeAmsuNZluJvdNRHjh_JrNOa1i_NAK7fO4A8nHF-VK9wTdoNeB_86pqvVgPe7DlIAoejRnskAyPKSqZtFPOMueM6fkVt2rxyekIfFV4qNkPoHdmlqMNQXCmcubCGJAbBzEvHAaczA-92wX0ESxFQWX_FpQPvHc3eKbq9viDRO8Mx1ZqxHnZwKkYVrAofWT_IP7Sx8jzM7QJqpAtpl_rGf4jJAcx-CEWaOKhp023Hx5ylJLOJIv3_d07Wt2c">
<!-- Verification Badge -->
<div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-outline-variant/30">
<span class="material-symbols-outlined text-emerald-600 text-[18px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-label-sm text-emerald-800">Đã xác minh</span>
</div>
</div>
<!-- Improvement Strip -->
<div class="flex gap-stack-sm overflow-x-auto hide-scrollbar pb-stack-md">
<!-- Original -->
<button class="flex-shrink-0 flex flex-col gap-2 w-24 group outline-none" onclick="selectVariant(this)">
<div class="aspect-square rounded border-2 border-primary overflow-hidden">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" data-alt="A slightly dark, unedited photo of a beige blazer hanging against a neutral wall, representing a 'raw' user-uploaded garment photo. The lighting is natural but somewhat dim, capturing the authentic appearance of the linen fabric before AI enhancement." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCWUerCMR1X8ovHlupP7Qk-dC4dkH8z2D3-qGhCaTX85RXcfeF-Uhj0bW7vr0V9r6OWsXY2RFaUWKnizPXYxhZyCEBk0P9bWVdI7saFWyVikaS0qsZJo6F-9uUVt9NWkB3Zu8HTOV8U2rL4v7zGwq6bS2MwPYwFXEhGhxFUnmviC5yG41SUgKqily6ipn7TDhK_l3NyJ-Ha6GLC_F4aoMlLngMRGuHQ6hKlLb4sk8HXnJCLvUOZdG46p0Dq8oiHTb5Wn7_NJhHfDI">
</div>
<span class="font-label-sm text-label-sm text-primary text-center">Ảnh gốc</span>
</button>
<!-- Enhanced 1 -->
<button class="flex-shrink-0 flex flex-col gap-2 w-24 group outline-none" onclick="selectVariant(this)">
<div class="aspect-square rounded border-2 border-transparent hover:border-outline-variant transition-colors overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A digitally enhanced version of a beige linen blazer, with boosted exposure and color correction. The fabric looks more vibrant and the details of the weave are sharper, set against a clean studio-white backdrop for a professional look." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJqSVc7DHxnfv82aCqTPKVwaYfarudDCwZ5IpLe1V7JtAWCTNyCc_5JWZh3f0lDiSTh0s7CuDI1vpTsq7N87v48q7Ybb7LhIN4WeRKWQasQtXbjyyl1r1uVrk9b74DOKtu5pIenZq_2sXxB4j95aZj8qv94zuk7TdID2BNoIOQfl5zrQzSu1VjPotGvmS6DBQ7J-Sy5UJv5cIrcqhQCXVtAr7i6fLwR3Khb9PJdFQapcBEHp1_YsPZSnlIifpS5Tgd5PX6hsOS3fA">
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Cải thiện 1</span>
</button>
<!-- Enhanced 2 -->
<button class="flex-shrink-0 flex flex-col gap-2 w-24 group outline-none" onclick="selectVariant(this)">
<div class="aspect-square rounded border-2 border-transparent hover:border-outline-variant transition-colors overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional AI-processed fashion image of a beige linen blazer where the background has been completely removed and replaced with a soft aesthetic linen texture. The garment is perfectly centered and lit with soft, flattering editorial lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyk_M-4U82bpaMPf-6HhKgP5_KXIATbNudghQ6hVQApv-6fgS70gGdTS41cxCai-vgcohF5WiviaNf2K_dVPRDEDxNxPI0RTITMS_gWb8IwWuXk_oaVsPKFEU_Olcd-bRB0ahLawGcchirGi2Hq8uSQeG7oX6DsdxXCqtWjdK6Brz_7wVvQnWkDQPsI5VPC4x9jHj1bDssi3nVOoSnOo6W7pR3EGzx9fRHFkWEfeJzg_iasQxRVlpVTOxtf4pWwbx8G2D6z0aLu_A">
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Cải thiện 2</span>
</button>
</div>
<!-- Form Fields -->
<div class="space-y-stack-md">
<!-- Field: Name Suggestion -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Tên gợi ý</label>
<input class="bg-transparent border-b border-outline-variant py-2 font-body-lg text-body-lg focus:border-primary focus:ring-0 transition-colors placeholder:text-outline-variant" type="text" value="Blazer Linen Cát">
</div>
<div class="grid grid-cols-2 gap-x-gutter gap-y-stack-md">
<!-- Field: Category -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Loại đồ</label>
<div class="relative">
<input class="w-full bg-transparent border-b border-outline-variant py-2 font-body-md text-body-md focus:border-primary focus:ring-0 transition-colors" type="text" value="Blazer">
<span class="material-symbols-outlined absolute right-0 bottom-2 text-on-surface-variant text-[18px]">expand_more</span>
</div>
</div>
<!-- Field: Color -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Màu sắc</label>
<div class="flex items-center gap-2 border-b border-outline-variant py-2">
<div class="w-4 h-4 rounded-full bg-[#E5DACE] border border-outline-variant/30"></div>
<input class="w-full bg-transparent border-none p-0 font-body-md text-body-md focus:ring-0" type="text" value="Kem">
</div>
</div>
<!-- Field: Material -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Chất liệu</label>
<input class="bg-transparent border-b border-outline-variant py-2 font-body-md text-body-md focus:border-primary focus:ring-0 transition-colors" type="text" value="Linen">
</div>
<!-- Field: Style -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Phong cách</label>
<input class="bg-transparent border-b border-outline-variant py-2 font-body-md text-body-md focus:border-primary focus:ring-0 transition-colors" type="text" value="Tối giản">
</div>
</div>
<!-- Field: Season -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Mùa</label>
<div class="flex gap-2 pt-2">
<span class="px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm">Xuân Hè</span>
<span class="px-3 py-1 rounded-full border border-outline-variant text-on-surface-variant font-label-sm text-label-sm">Thu Đông</span>
</div>
</div>
<!-- Verification Status Badge (Alternative Variant) -->
<div class="pt-stack-sm">
<div class="inline-flex items-center gap-2 bg-secondary-fixed/30 px-3 py-2 rounded">
<span class="material-symbols-outlined text-secondary text-[18px]">info</span>
<p class="font-label-sm text-label-sm text-on-secondary-container">Một số thông tin được AI tự động phân tích</p>
</div>
</div>
</div>
</main>
<!-- Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md p-margin-mobile flex flex-col gap-stack-sm pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md uppercase tracking-widest active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
            Lưu vào tủ đồ
            <span class="material-symbols-outlined text-[20px]">check</span>
</button>
<button class="w-full py-2 text-error font-label-sm text-label-sm uppercase tracking-widest active:opacity-60 transition-opacity">
            Xóa ảnh này
        </button>
</div>
<script>
        function selectVariant(element) {
            // Remove selection from all
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                const imgContainer = btn.querySelector('div');
                imgContainer.classList.remove('border-primary');
                imgContainer.classList.add('border-transparent');
                
                const label = btn.querySelector('span');
                label.classList.remove('text-primary');
                label.classList.add('text-on-surface-variant');
            });
            
            // Add selection to clicked
            const selectedContainer = element.querySelector('div');
            selectedContainer.classList.add('border-primary');
            selectedContainer.classList.remove('border-transparent');
            
            const selectedLabel = element.querySelector('span');
            selectedLabel.classList.add('text-primary');
            selectedLabel.classList.remove('text-on-surface-variant');

            // Haptic-like feedback
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Simple animation for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('opacity-100');
            });
        });
    </script>
</body></html>
