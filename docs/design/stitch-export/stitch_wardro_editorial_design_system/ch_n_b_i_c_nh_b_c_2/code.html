                Tạo ảnh thử đồ
                <span class="material-symbols-outlined">auto_awesome</span>
</button>
</div>
</section>
<!-- Bottom Navigation Shell (Filter Applied: Suppressed for focused Task Journey) -->
<!-- Navigation is hidden as per "Relevance Check" for focused tasks like step-based workflows -->
<script>
        // Micro-interactions for tile selection
        document.querySelectorAll('.group.cursor-pointer').forEach(tile => {
            tile.addEventListener('click', () => {
                // Remove selected classes from all
                document.querySelectorAll('.group.cursor-pointer').forEach(t => {
                    t.classList.remove('selected-highlight', 'border-2');
                    t.classList.add('border', 'border-outline-variant/30');
                    const check = t.querySelector('.bg-secondary-container');
                    if (check) check.remove();
                    const line = t.querySelector('.h-0.5');
                    if (line) line.remove();
                });

                // Add selected classes to clicked
                tile.classList.add('selected-highlight', 'border-2');
                tile.classList.remove('border', 'border-outline-variant/30');
                
                // Add Checkmark
                const checkDiv = document.createElement('div');
                checkDiv.className = 'absolute top-2 right-2 bg-secondary-container text-primary rounded-full p-1 shadow-sm';
                checkDiv.innerHTML = '<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
                tile.appendChild(checkDiv);

                // Add Underline to label
                const labelContainer = tile.querySelector('.flex-col') || tile.querySelector('.scene-card-overlay');
                if (labelContainer.classList.contains('scene-card-overlay')) {
                    const span = labelContainer.querySelector('span');
                    const wrap = document.createElement('div');
                    wrap.className = 'flex flex-col gap-1';
                    span.parentNode.insertBefore(wrap, span);
                    wrap.appendChild(span);
                    const line = document.createElement('div');
                    line.className = 'h-0.5 w-6 bg-secondary-container';
                    wrap.appendChild(line);
                }
            });
        });

        // Atmospheric Scroll Effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('editorial-shadow');
                header.style.backgroundColor = '#ffffff';
            } else {
                header.classList.remove('editorial-shadow');
                header.style.backgroundColor = '#f9f9f9';
            }
        });
    </script>
