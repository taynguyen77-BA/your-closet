<style>
        body {
            background-color: #f7f4f0; /* Linen background */
            color: #231a0f; /* Espresso */
        }
        .linen-bg { background-color: #f7f4f0; }
        .espresso-fill { background-color: #231a0f; color: #ffffff; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-body-md text-on-background min-h-screen">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface/90 backdrop-blur-md z-50 border-b border-outline-variant/30 px-margin-mobile h-16 flex justify-between items-center">
<button class="hover:opacity-70 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Xác nhận đơn hàng</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-[600px] mx-auto px-margin-mobile pt-stack-md pb-32">
<!-- Summary Card -->
<section class="mb-stack-lg">
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded p-stack-md">
<div class="flex justify-between items-start mb-stack-sm gap-4">
<div>
<h2 class="font-headline-sm text-headline-sm mb-1">Gói Pro</h2>
<p class="font-label-md text-label-md text-on-surface-variant">Thanh toán hàng tháng</p>
</div>
<span class="font-headline-sm text-headline-sm">199.000đ</span>
</div>
<div class="mt-stack-md pt-stack-md border-t border-outline-variant/10">
<div class="flex justify-between mb-2">
<span class="font-body-md text-on-surface-variant">Tạm tính</span>
<span class="font-body-md">199.000đ</span>
</div>
<div class="flex justify-between mb-2">
<span class="font-body-md text-on-surface-variant">Thuế (VAT)</span>
<span class="font-body-md">0đ</span>
</div>
<div class="flex justify-between mt-stack-sm pt-stack-sm border-t border-outline-variant/10">
<span class="font-label-md text-label-md uppercase tracking-wider">Tổng cộng</span>
<span class="font-headline-sm text-headline-sm">199.000đ</span>
</div>
</div>
</div>
</section>
<!-- Payment Method -->
<section class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-sm">
<h3 class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Phương thức thanh toán</h3>
<a class="font-label-md text-label-md text-secondary underline hover:opacity-70 transition-opacity" href="#">Đổi</a>
</div>
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded p-stack-md flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-surface p-2 rounded-sm border border-outline-variant/10">
<img class="w-full h-full object-contain" data-alt="A clean, minimalist logo of VNPay payment gateway, featuring a stylized red and blue icon on a crisp white background, suitable for a premium fintech application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCV8KcFYL_HjMk5b0I35MJ6F3pe4MewgDftmlQDRnluZqHoBUpCOfq8ptYSg535EfTrfpNUWZpZVvsrKNBZlSsb5dE-ypJvNkUp4ycJedJkyLI_Qel6vrbUV8iep_bxHFMHQWGRPNjCTqUYUntWcsbY4WeGfZ2i3_5S0Rt61bKDp_XazAzfAxApzyYOPXYjhZQ4ePT1kdJyJQL_98sO0oFcQTwePlC5EHte5DYU0P5P1X_dzdQiAnPM2ET4MKTYqyMEji1fq-_30f0">
</div>
<div class="flex-1 flex flex-col gap-0.5">
<p class="font-body-md font-bold">VNPay</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Ví điện tử / Ngân hàng</p>
</div>
<span class="material-symbols-outlined text-outline">check_circle</span>
</div>
</section>
<!-- Visual Context / Editorial Spacer -->
<section class="mb-stack-lg">
<div class="relative overflow-hidden rounded-xl aspect-[16/9] group">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="An editorial fashion photograph of a person wearing a high-end beige linen suit in a minimalist, sun-drenched studio. The aesthetic is clean, sophisticated, and tranquil, with soft shadows and a high-key lighting setup that emphasizes texture and slow-fashion quality." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD2LoHYfya2kuayBdKe_0T30gEJT-g6sinuxGVlk3igDZBdRs0bOoVBMDvtR1aTqTNuLtkxDIJsgxuipOPs7LtYEdal4YukMqJRf-ApTp1RoObT0a4YRcr4RNsZOwI3YJiLCRBI5lqUNu-ZAvoS64U3KyYeVaMj5XH_Vri0HRPzlfzF_6cLM3163Mmpu4zZPgrNO-bsrNyXgKv7nk5ZcWwitCn71U1Hk7MooeSR0bYnzVnZhhQ9-vP8v4H2qCJEEn3SmxJDKJ6NeH0')"></div>
<div class="absolute inset-0 bg-black/5"></div>
</div>
</section>
<!-- Terms -->
<p class="font-label-sm text-label-sm text-on-surface-variant text-center px-4 leading-relaxed mb-stack-md">
            Bằng việc nhấn Thanh toán, bạn đồng ý với <a class="underline" href="#">Điều khoản Dịch vụ</a> và <a class="underline" href="#">Chính sách Bảo mật</a> của LINEN.
        </p>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/80 backdrop-blur-lg border-t border-outline-variant/10 px-margin-mobile pt-4 pb-8 z-50">
<div class="max-w-[600px] mx-auto">
<button class="w-full espresso-fill py-4 rounded-full font-label-md text-label-md uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Thanh toán</span>
<span class="material-symbols-outlined text-[18px]">lock</span>
</button>
</div>
</div>
<!-- Background Decorative Element -->
<div class="fixed top-0 right-0 w-1/3 h-screen -z-10 opacity-20 pointer-events-none">
<div class="w-full h-full" style="background: radial-gradient(circle at center, #f1e0ce 0%, transparent 70%);"></div>
</div>
<script>
        // Subtle micro-interactions
        document.addEventListener('DOMContentLoaded', () => {
            const payButton = document.querySelector('button.espresso-fill');
            payButton.addEventListener('click', () => {
                payButton.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Đang xử lý...
                `;
                setTimeout(() => {
                    payButton.innerHTML = `<span>Thanh toán</span><span class="material-symbols-outlined text-[18px]">lock</span>`;
                }, 3000);
            });
        });
    </script>



</body></html>
