<body class="min-h-screen flex flex-col font-body-md text-body-md">

</button>

<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile">
<header class="mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-primary leading-tight">
                Nhập số điện thoại
            </h1>
</header>
<section class="space-y-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm uppercase tracking-widest text-outline" for="phone">
                    Số điện thoại
                </label>
<div class="flex items-center gap-4">
<span class="font-body-lg text-body-lg text-primary border-b border-primary pb-2 min-w-[48px]">
                        +84
                    </span>
<input autofocus="" class="flex-grow input-underline font-body-lg text-body-lg text-primary placeholder:text-outline/40 py-2" id="phone" name="phone" placeholder="000 000 000" type="tel">
</div>
<p class="font-label-sm text-label-sm text-outline mt-2 font-normal opacity-80">
                    Chúng tôi sẽ gửi mã xác nhận qua SMS
                </p>
</div>
</section>
<!-- Aesthetic Editorial Element -->
<div class="mt-auto mb-stack-lg opacity-20 select-none pointer-events-none">
<p class="font-headline-sm text-headline-sm italic">Minimalist lifestyle curation.</p>
</div>
</main>
<!-- Footer Action -->
<footer class="p-margin-mobile pb-12">
<button class="w-full bg-primary text-on-primary py-5 font-label-md text-label-md tracking-[0.1em] uppercase transition-all hover:opacity-90 active:scale-[0.98] shadow-sm">
            Gửi mã OTP
        </button>
</footer>
<!-- Background Decorative Elements -->
<div class="fixed top-0 right-0 w-1/2 h-screen overflow-hidden -z-10 opacity-[0.03]">
<div class="w-full h-full bg-no-repeat bg-cover bg-center mix-blend-multiply" data-alt="A high-fashion editorial close-up of premium linen fabric texture, showcasing soft natural folds and intricate weave. The lighting is bright and airy, reflecting a sophisticated minimalist luxury aesthetic. Muted tones of sand and off-white dominate the frame, creating a sense of calm and tactile quality that aligns with a high-end fashion operating system." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD6JZSsPGg8l4PjQIsNgPJm54fumGbKGR6v2rbwEt8b7YJ1TMTchjxgciiKOJ31njtdju19RAhKcO2o0cTNYQq8uO8nXryMA_ZJuRYWzeTz7OWkKj8Xhn983oTzg9IQyopHNK5wJN3-x6H8krI6dPNGjX6TJZezHOiQBDvi6MWKL0vORP5BkRTCvND4p3_UxN8OtDgK-wkvaUMusQMtl5P70WKZBhPMG4W3SNBhuX7w1Y1NSuZd0npRLdoi6GqtDElfTSejUKle3_U')">
</div>

<script>
        // Micro-interaction for the phone input
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            // Remove non-numeric characters for a clean input feel
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 9) value = value.slice(0, 10);
            
            // Basic formatting for aesthetics 000 000 000
            const match = value.match(/^(\d{3})(\d{3})(\d{3,4})$/);
            if (match) {
                e.target.value = `${match[1]} ${match[2]} ${match[3]}`;
            } else {
                e.target.value = value;
            }
        });

        // Simple button active state simulation
        const primaryBtn = document.querySelector('button.bg-primary');
        primaryBtn.addEventListener('click', function() {
            this.textContent = 'ĐANG GỬI...';
            this.style.opacity = '0.7';
            setTimeout(() => {
                this.textContent = 'GỬI MÃ OTP';
                this.style.opacity = '1';
            }, 2000);
        });
    </script>
