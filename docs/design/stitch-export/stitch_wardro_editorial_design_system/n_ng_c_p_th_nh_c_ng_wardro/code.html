<!-- Confetti Script for a premium "celebration" feel -->
<script>
        const btn = document.getElementById('cta-btn');
        const container = document.body;

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                const startX = window.innerWidth / 2;
                const startY = window.innerHeight / 2;
                
                confetti.style.left = startX + 'px';
                confetti.style.top = startY + 'px';
                confetti.style.backgroundColor = i % 2 === 0 ? '#705b3e' : '#f1e0ce';
                
                container.appendChild(confetti);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const tx = Math.cos(angle) * 200 * Math.random();
                const ty = Math.sin(angle) * 200 * Math.random();

                confetti.animate([
                    { opacity: 1, transform: 'translate(0, 0) scale(1)' },
                    { opacity: 0, transform: `translate(${tx}px, ${ty}px) scale(0)` }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    fill: 'forwards'
                }).onfinish = () => confetti.remove();
            }
        }

        // Trigger once on load for a soft entry
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(createConfetti, 500);
        });

        btn.addEventListener('click', (e) => {
            createConfetti();
            // Optional redirect logic
            console.log('Navigating to home...');
        });
    </script>
