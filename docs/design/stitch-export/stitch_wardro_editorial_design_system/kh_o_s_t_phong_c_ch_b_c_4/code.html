<style>
        body {
            background-color: #F7F4F0; /* Linen background as requested */
            color: #1a1c1c;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .step-selected {
            background-color: #D4B896 !important;
            color: #ffffff !important;
            border-color: #D4B896 !important;
            transform: scale(1.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="font-body-md text-body-md antialiased overflow-x-hidden">
<!-- Top AppBar Implementation based on JSON -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface px-margin-mobile h-16 flex justify-between items-center transition-opacity hover:opacity-80">
<div class="flex items-center gap-2">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">Wardro</span>
</div>
<button class="text-primary font-label-md text-label-md active:scale-95 transition-transform">Bỏ qua</button>
</header>
<!-- Progress Bar (Top Position) -->
<div class="fixed top-16 left-0 w-full h-1 bg-outline-variant/20 z-40">
<div class="h-full bg-primary w-[80%] transition-all duration-700 ease-in-out"></div>
</div>
<!-- Main Content Canvas -->
<main class="pt-32 pb-40 px-margin-mobile flex flex-col min-h-screen">
<!-- Imagery Section: Editorial Feel -->
<div class="mb-stack-lg rounded-xl overflow-hidden aspect-[4/5] relative bg-white shadow-sm">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A high-fashion editorial portrait of a young Vietnamese individual standing in a minimalist concrete studio. The lighting is soft and cinematic, casting gentle shadows that emphasize the textures of a structured oversized linen blazer and tailored trousers. The color palette is composed of muted earth tones, soft linen whites, and deep espresso blacks, creating a sophisticated and quiet luxury atmosphere typical of modern Vietnamese style curation." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDn8AZG4QzgcM0MccIjW4uoiNg4L62t_CpITi8uEBNUn8oge40Q4VURW3VH5tuBhYUd_8bFr15ieIYn8gPGIQBFTYcyeSz83I1iOJub_jkAS2WYv6V54NnzpBaZYa_O7Wi_sbERyFj_F03vyyfB_Ye3oRhSG5rBadyEroz60qtN4h9dF7Z5EE_gVupms75KiHFoFFPk9xFJicuadsaaSZ4jgWkgHVY_yWMvfyKoGq3iD-GTUQB-MqvnEbyJPqaam7KhoDuhYspQPNQ')">
</div>
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black/20 to-transparent">
<p class="text-white font-label-sm text-label-sm tracking-widest">STEP 04: CONFIDENCE</p>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-primary mb-stack-md leading-tight">
            Bạn tự tin về gu thời trang của mình đến mức nào?
        </h1>
<!-- Scale Selector Component -->
<section class="mt-stack-md">
<div class="flex flex-col gap-6">
<!-- Scale Points -->
<div class="flex justify-between items-end h-24 gap-2 px-2">
<!-- Point 1 -->
<button class="scale-btn flex flex-col items-center gap-3 flex-1 group" onclick="selectStep(1)">
<div class="w-12 h-12 rounded-full border border-outline/30 flex items-center justify-center transition-all duration-300 bg-white" id="circle-1">
<span class="font-label-md text-label-md">1</span>
</div>
</button>
<!-- Point 2 -->
<button class="scale-btn flex flex-col items-center gap-3 flex-1 group" onclick="selectStep(2)">
<div class="w-12 h-12 rounded-full border border-outline/30 flex items-center justify-center transition-all duration-300 bg-white" id="circle-2">
<span class="font-label-md text-label-md">2</span>
</div>
</button>
<!-- Point 3 -->
<button class="scale-btn flex flex-col items-center gap-3 flex-1 group" onclick="selectStep(3)">
<div class="w-14 h-14 rounded-full border border-outline/30 flex items-center justify-center transition-all duration-300 bg-white shadow-sm" id="circle-3">
<span class="font-label-md text-label-md">3</span>
</div>
</button>
<!-- Point 4 -->
<button class="scale-btn flex flex-col items-center gap-3 flex-1 group" onclick="selectStep(4)">
<div class="w-12 h-12 rounded-full border border-outline/30 flex items-center justify-center transition-all duration-300 bg-white" id="circle-4">
<span class="font-label-md text-label-md">4</span>
</div>
</button>
<!-- Point 5 -->
<button class="scale-btn flex flex-col items-center gap-3 flex-1 group" onclick="selectStep(5)">
<div class="w-12 h-12 rounded-full border border-outline/30 flex items-center justify-center transition-all duration-300 bg-white" id="circle-5">
<span class="font-label-md text-label-md">5</span>
</div>
</button>
</div>
<!-- Labels -->
<div class="flex justify-between px-2">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Cần tư vấn</span>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Chuyên gia</span>
</div>
</div>
<p class="mt-stack-md text-center text-on-surface-variant font-body-md text-body-md italic opacity-0 transition-opacity duration-300" id="description-text">
                Hãy chọn một mức độ để chúng tôi hiểu bạn hơn.
            </p>
</section>
</main>
<!-- Bottom Navigation Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-surface px-margin-mobile py-6 flex justify-between items-center z-50 border-t border-outline-variant/10">
<button class="flex items-center gap-2 text-outline font-label-md text-label-md hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]" data-icon="chevron_left">chevron_left</span>
            Quay lại
        </button>
<button class="bg-primary text-white px-10 py-4 rounded-full font-label-md text-label-md shadow-lg active:scale-95 transition-all opacity-50 cursor-not-allowed" id="next-btn">
            Tiếp tục
        </button>
</footer>
<script>
        const descriptions = {
            1: "Tôi thường băn khoăn mỗi khi phối đồ.",
            2: "Tôi biết mình thích gì nhưng đôi khi vẫn cần gợi ý.",
            3: "Tôi khá tự tin và muốn khám phá thêm phong cách mới.",
            4: "Tôi am hiểu về xu hướng và biết cách làm mới mình.",
            5: "Fashionista chính hiệu! Tôi làm chủ mọi bộ trang phục."
        };

        function selectStep(step) {
            // Remove previous selections
            document.querySelectorAll('.scale-btn div').forEach(div => {
                div.classList.remove('step-selected');
            });

            // Add new selection
            const activeCircle = document.getElementById(`circle-${step}`);
            activeCircle.classList.add('step-selected');

            // Update description
            const desc = document.getElementById('description-text');
            desc.textContent = descriptions[step];
            desc.classList.remove('opacity-0');
            desc.classList.add('opacity-100');

            // Enable Next button
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            nextBtn.classList.add('opacity-100', 'cursor-pointer');
            
            // Subtle feedback vibration if supported
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }
    </script>
</body></html>
