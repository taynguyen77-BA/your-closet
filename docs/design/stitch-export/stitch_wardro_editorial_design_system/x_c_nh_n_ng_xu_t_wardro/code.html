                    ĐĂNG XUẤT
                </button>
<button class="w-full py-4 bg-transparent text-on-surface-variant font-label-md rounded-full active:bg-surface-container transition-colors duration-200 uppercase tracking-widest" onclick="closeSheet()">

                </button>

<script>
        // Bottom Sheet Logic
        const overlay = document.getElementById('logout-overlay');
        const sheet = document.getElementById('logout-sheet');
        const mainContent = document.getElementById('main-content');

        function openSheet() {
            overlay.classList.add('active');
            sheet.classList.add('active');
            mainContent.classList.add('profile-backdrop');
            document.body.style.overflow = 'hidden';
        }

        function closeSheet() {
            sheet.classList.remove('active');
            overlay.classList.remove('active');
            mainContent.classList.remove('profile-backdrop');
            document.body.style.overflow = '';
        }

        function handleLogout() {
            // Simulated logout action
            const btn = event.target;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }

        // Close when clicking overlay (outside sheet)
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeSheet();
        });

        // Initialize state (showing the sheet as requested)
        window.onload = () => {
            setTimeout(openSheet, 500);
        };
    </script>
