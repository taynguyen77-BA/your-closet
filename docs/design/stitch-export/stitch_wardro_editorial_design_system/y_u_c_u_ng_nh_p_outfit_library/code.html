<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar Section -->
<header class="w-full top-0 sticky z-40 bg-background flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
<h1 class="font-headline-sm text-headline-sm tracking-tight text-primary uppercase">Wardro</h1>
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
</div>
</header>
<!-- Main Content: Guest-Blocked Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile">
<!-- Editorial Section Header -->
<div class="mt-stack-lg mb-stack-lg text-center md:text-left md:max-w-container-max md:mx-auto w-full">
<h2 class="font-headline-md text-headline-md text-primary mb-2">TỦ ĐỒ CỦA TÔI</h2>
<div class="h-px bg-outline-variant w-16 mx-auto md:mx-0"></div>
</div>
<!-- Blocked Content Card -->
<section class="flex-grow flex items-center justify-center mb-24">
<div class="bg-surface-container-lowest w-full max-w-md p-stack-lg rounded-lg editorial-shadow flex flex-col items-center text-center" style="opacity: 1; transform: translateY(0px); transition: opacity 0.8s ease-out, transform 0.8s ease-out;">
<!-- Icon: Elegant line icon -->
<div class="mb-stack-md w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[40px]" data-icon="inventory_2" style="font-variation-settings: 'wght' 200;">inventory_2</span>
</div>
<!-- Title -->
<h3 class="font-headline-sm text-headline-sm text-primary mb-4 leading-tight">
                    Đăng nhập để xem outfit cá nhân
                </h3>
<!-- Description -->
<p class="font-body-md text-body-md text-on-surface-variant px-4 mb-stack-lg max-w-xs">
                    Tiến độ, phần thưởng và lượt AI là dữ liệu cá nhân nên không hiển thị trong chế độ guest.
                </p>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-label-md text-label-md uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all">
                    Đăng nhập
                </button>
<!-- Visual Decoration (Abstract background hint) -->
<div class="mt-stack-lg opacity-40 grayscale pointer-events-none">
<img class="w-32 h-32 object-cover rounded-full mix-blend-multiply" data-alt="A soft-focus, minimalist high-fashion editorial shot of beige silk garments hanging in a bright, sun-drenched minimalist closet with architectural arches. The lighting is warm and natural, creating long soft shadows on linen-textured walls. The aesthetic is clean, premium, and sophisticated, perfectly matching a luxury fashion operating system interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMRDIpBBTJHzaUCgWkczBI-RQX4VrZL7QeVItmwg7DiztZlaaEw3nosCLMhrHJvbCA52HhfgpImWJ3DNCwXQgTvn8wVPqcR9-bOUGUWl0Utkvq5B1yB89j_CPmKYJdfB--X_8nnu_z5fgUk7jQOH6n3qybYIpWWNttz6YIqc5JhlJ2s3Mr5SII5GUTLJPgr8-Lh4S2ZIIdDt_RkFse5su-sZJp5UWyfRrKgeyWnr8EW9zEMUAjEVRe0GaNtVVwgHttLQd6SR0dS2E">
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-surface-container-lowest border-t border-outline-variant/30">

<span class="font-label-sm text-label-sm uppercase tracking-wider mt-1">Trang chủ</span></a>

<span class="font-label-sm text-label-sm uppercase tracking-wider mt-1">Tủ đồ</span></a>

<span class="font-label-sm text-label-sm uppercase tracking-wider mt-1">Thử đồ</span></a>
<a class="flex flex-col items-center justify-center text-on-surface-variant h-[44px] min-w-[44px] opacity-60 hover:bg-surface-container-low transition-colors active:scale-90 duration-150" href="#"><span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider mt-1">Cộng đồng</span></a>

<span class="font-label-sm text-label-sm uppercase tracking-wider mt-1">Cá nhân</span></a>

<script>
        // Micro-interactions for button press
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simple Fade-in for the blocked card
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('section > div');
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';
            card.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
