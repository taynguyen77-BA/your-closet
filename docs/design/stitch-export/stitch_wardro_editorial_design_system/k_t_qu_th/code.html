<style>

<body class="bg-background text-on-surface font-body-md overflow-hidden">
<!-- Full-bleed background result -->
<div class="fixed inset-0 z-0">
<img alt="Virtual try-on result" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe9x4_mZK6gVQqKHsEEHGA4qPR6N8rRF5p-TSBSbSLpNkXPGPgBWCotUOW4Q72GoYVK2XcByAWae_11sGLbvA6DJ-WiXygQnEaobpAki4HgufBkbWWnBkP5pb6uDiyMtVDatmQmXfYbTXe_kidDrIQ9X_dnsFCJ-EIjzFWxXdE_jml28vlR23TLlg5TsAQL8-sPfZ3M1FIC9TY2P1ULcpbBF6GSUsqXm7qis4VmPxpm6hRjDeSOA7TuFg6zCFM_wwPlBgWjIb772I">
<!-- Subtle Scrim for UI Legibility -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-black/20 to-transparent"></div>
<div class="absolute inset-x-0 bottom-0 h-64 scrim-bottom"></div>
<!-- Branded Watermark -->
<div class="absolute bottom-32 right-margin-mobile opacity-40 select-none">
<span class="font-headline-sm text-surface tracking-widest text-[14px] uppercase">Wardro</span>
</div>
</div>
<!-- Floating TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 glass-header">
<button class="w-10 h-10 flex items-center justify-center text-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-label-sm text-surface uppercase tracking-[0.2em] pt-1">Kết quả thử đồ - Wardro</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Canvas (Layout-less container for mobile full bleed) -->
<main class="relative z-10 flex flex-col h-screen justify-end items-center pb-12">
<!-- Action Container -->
<div class="w-full max-w-[400px] px-margin-mobile space-y-6 text-center">
<!-- Bottom Action Bar (Bento-style Glass Cards) -->
<div class="grid grid-cols-3 gap-3">
<!-- Save Image -->
<button class="bg-surface/10 backdrop-blur-md border border-surface/20 rounded-xl p-4 flex flex-col items-center justify-center space-y-2 text-surface active:scale-90 transition-all">
<span class="material-symbols-outlined">download</span>
<span class="font-label-sm text-[10px] uppercase">Lưu ảnh</span>
</button>
<!-- Share -->
<button class="bg-surface/10 backdrop-blur-md border border-surface/20 rounded-xl p-4 flex flex-col items-center justify-center space-y-2 text-surface active:scale-90 transition-all">
<span class="material-symbols-outlined">share</span>
<span class="font-label-sm text-[10px] uppercase">Chia sẻ</span>
</button>
<!-- Save Outfit -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center space-y-2 text-primary active:scale-90 transition-all shadow-xl">
<span class="material-symbols-outlined fill-icon" style="font-variation-settings: 'FILL' 1;">checkroom</span>
<span class="font-label-sm text-[10px] uppercase">Lưu outfit</span>
</button>
</div>
<!-- Context Retray Action -->
<button class="group inline-flex flex-col items-center space-y-2 text-surface/80 hover:text-surface transition-colors">
<span class="font-label-md border-b border-surface/30 pb-0.5 group-hover:border-surface transition-all">Thử lại với bối cảnh khác</span>
</button>
</div>
</main>
<!-- Bottom Navigation Shell (Suppressed for focus per "Relevance Check" logic, but placeholder for structure if needed) -->
<!-- In this Task-Focused screen, we hide the global nav to prioritize the result canvas -->
<script>
        // Micro-interaction for the "Save Outfit" success feedback
        const saveBtn = document.querySelector('button.bg-surface-container-lowest');
        saveBtn.addEventListener('click', () => {
            const label = saveBtn.querySelector('span:last-child');
            const icon = saveBtn.querySelector('.material-symbols-outlined');
            
            const originalLabel = label.textContent;
            const originalIcon = icon.textContent;

            label.textContent = "Đã lưu";
            icon.textContent = "done_all";
            saveBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
            
            setTimeout(() => {
                label.textContent = originalLabel;
                icon.textContent = originalIcon;
                saveBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
            }, 2000);
        });

        // Interactive subtle parallax on move
        document.body.addEventListener('mousemove', (e) => {
            const img = document.querySelector('img');
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            img.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
