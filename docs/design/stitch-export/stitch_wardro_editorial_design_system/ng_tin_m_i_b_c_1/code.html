<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100..900&amp;family=DM+Serif+Display:wght@100..900&amp;display=swap" rel="stylesheet">

        .active-selection {

            background-color: #ffffff !important;
        }
        .step-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            background-color: #f9f9f9; /* Linen background from system */
        }
    </style>

                      "inverse-surface": "#2f3131",
                      "secondary-container": "#f9dbb7",

                      "primary": "#000000",
                      "on-surface-variant": "#4d463e",
                      "secondary-fixed": "#fcdeba",
                      "on-secondary-fixed-variant": "#574329",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#d4c4b3",
                      "error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#c8c6c2",
                      "surface-container-low": "#f3f3f4",
                      "on-primary-fixed": "#231a0f",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#f1e0ce",
                      "outline-variant": "#cfc5bb",
                      "outline": "#7e766d",

                      "tertiary-fixed": "#e5e2de",

                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]

          },
        }

</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background border-b border-outline-variant/30 z-50">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full">
<button aria-label="Close" class="hover:opacity-70 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary">Đăng tin mới</h1>
<button aria-label="More" class="hover:opacity-70 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">more_horiz</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop pt-stack-lg pb-32 max-w-container-max mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full max-w-md mb-stack-lg">
<div class="flex justify-between items-end mb-2">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Bước 1 trên 5</span>
<span class="font-headline-sm text-headline-sm-mobile text-primary">20%</span>
</div>
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/5 transition-all duration-700 ease-out"></div>
</div>
</div>
<!-- Editorial Headline -->
<div class="text-center mb-stack-lg">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-stack-sm">
                Chọn nguồn món đồ
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">
                Bắt đầu hành trình định hình phong cách cá nhân của bạn bằng cách chọn một món đồ từ tủ đồ hiện có hoặc làm mới với hình ảnh mới.
            </p>
</div>
<!-- Selection Options -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter w-full max-w-4xl">
<!-- Option 1: Closet -->
<label class="group cursor-pointer relative block">
<input checked="" class="sr-only peer" name="source" onchange="handleSelection(this)" type="radio" value="closet">
<div class="h-full border border-outline-variant/30 bg-surface-container-lowest p-gutter rounded-lg transition-all duration-300 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary hover:shadow-sm overflow-hidden flex flex-col">
<div class="aspect-[4/5] mb-stack-md overflow-hidden bg-surface-container rounded">
<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" data-alt="An editorial photography shot of a perfectly organized minimalist walk-in closet. The clothing items are in soft neutral tones like linen, beige, and espresso. Natural sunlight streams through a window, casting soft shadows. The atmosphere is quiet luxury, emphasizing order and high-end fashion curation." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOd9N6zzFvzKO4rzq2mTxvJh4R0-Jzdqy78ofETanpurRMFfpmCWcHiAHuJGmfRt4rAnntsB2z8NLBLga3EcErobppepYb8Xh9VLNY31_CTyjiHOZLj1-6GUAOAtznAH-uj_ZcPoqNS7rvU3u0jJQbvR1-GRLyff3dwNZ8mFYyuRCW1zQ1nmP19-H3k_KW4whtRtBzPDZBVol68ThTDcdPsH_to2Lu9pS4xOr5pZyag6ztMMWX9ExKM14jP2BnEN_v4egqYDVVCHA">
</div>
<div class="mt-auto">
<div class="flex items-center justify-between mb-2">
<h3 class="font-headline-sm text-headline-sm text-primary">Tủ đồ của tôi</h3>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:group-[]:opacity-100 transition-opacity">check_circle</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Chọn từ những món đồ bạn đã lưu trữ và phân loại trong hệ thống.</p>
</div>
</div>
</label>
<!-- Option 2: Upload -->
<label class="group cursor-pointer relative block">
<input class="sr-only peer" name="source" onchange="handleSelection(this)" type="radio" value="upload">
<div class="h-full border border-outline-variant/30 bg-surface-container-lowest p-gutter rounded-lg transition-all duration-300 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary hover:shadow-sm overflow-hidden flex flex-col">
<div class="aspect-[4/5] mb-stack-md overflow-hidden bg-surface-container rounded flex items-center justify-center relative">
<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" data-alt="A professional studio setup for fashion photography. A single high-end silk garment hangs on a minimalist black wire hanger against a textured linen background. The lighting is soft-box studio lighting, creating a clean, crisp, editorial look. The palette is muted and sophisticated, reflecting a modern fashion operating system aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8XyRykt-Atv0WtTj1DdKlIi-ZLiZWKyRXLwYENjJSDJQVrO3Ljl-88xyLSDwkNZRbkcGqLRsfButA_j0opS23lVknUL2cKmVnSsosMn420XSdj31_S5YjejH429akQNQMLQvYMHbip2HIWLnjX4K6cupipQ74042GO8YldTP9Hys8pPiJYGXpLNHzXAC8zMBX84o9zJHRp5npMqHvDrI-udbL_cIaK6BDURsH3HbsGJ4PVjyDMPV31pqK2cypmVpuxWC8cIsdGRQ">
<div class="absolute inset-0 bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl">add_a_photo</span>
</div>
</div>
<div class="mt-auto">
<div class="flex items-center justify-between mb-2">
<h3 class="font-headline-sm text-headline-sm text-primary">Tải ảnh lên</h3>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:group-[]:opacity-100 transition-opacity">check_circle</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Chụp ảnh mới hoặc chọn từ thư viện ảnh của thiết bị để bắt đầu đăng tin.</p>
</div>
</div>
</label>
</div>
<!-- Action Footer -->
<div class="fixed bottom-0 left-0 w-full bg-background/80 backdrop-blur-md border-t border-outline-variant/20 px-margin-mobile md:px-margin-desktop py-stack-md flex justify-center z-40">
<button class="w-full max-w-md bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full uppercase tracking-[0.1em] hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/10">
                Tiếp theo
            </button>
</div>
</main>
<!-- Bottom Navigation (Suppressed per task focus on transactional screen, but included as per Shared Components JSON for reference if needed, hidden here) -->
<nav class="hidden md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface-container-lowest dark:bg-surface-container-highest pb-safe h-20 border-t border-outline-variant/20">
<a class="flex flex-col items-center justify-center text-primary dark:text-on-background" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant" href="#">
<span class="material-symbols-outlined">search</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant" href="#">
<span class="material-symbols-outlined">add_circle</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant" href="#">
<span class="material-symbols-outlined">favorite</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
<script>
        function handleSelection(input) {
            // Visual feedback logic can go here if needed beyond CSS peer selectors
            console.log("Selected source:", input.value);
        }

        // Simple animation for the progress bar on load
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.querySelector('.bg-primary.w-1\\/5');
            progressBar.style.width = '0%';
            setTimeout(() => {
                progressBar.style.width = '20%';
            }, 100);
        });
    </script>
</body></html>
