<body class="flex flex-col min-h-screen max-w-md mx-auto bg-background">
<!-- Top Navigation Header -->
<header class="w-full flex items-center px-margin-mobile py-8 sticky top-0 bg-background z-10">
<button aria-label="Quay lại" class="mr-4 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-[28px]">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Nhập mã OTP</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile">
<!-- Subtext Instruction -->
<div class="mt-4 mb-stack-lg">
<p class="font-body-md text-body-md text-outline">
                Mã gồm 6 chữ số đã được gửi tới 
                <span class="text-primary font-bold">090 ••• ••89</span>
</p>
</div>
<!-- OTP Input Grid -->
<!-- Error state container toggle: add class 'error-state' to the div below -->
<div class="flex justify-between items-center gap-2 mb-stack-md" id="otp-container">
<input class="otp-input w-12 h-14 bg-surface-container-lowest border border-outline-variant text-center font-headline-sm text-headline-sm rounded-lg transition-all focus:ring-0 appearance-none" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input class="otp-input w-12 h-14 bg-surface-container-lowest border border-outline-variant text-center font-headline-sm text-headline-sm rounded-lg transition-all focus:ring-0 appearance-none" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input class="otp-input w-12 h-14 bg-surface-container-lowest border border-outline-variant text-center font-headline-sm text-headline-sm rounded-lg transition-all focus:ring-0 appearance-none" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input class="otp-input w-12 h-14 bg-surface-container-lowest border border-outline-variant text-center font-headline-sm text-headline-sm rounded-lg transition-all focus:ring-0 appearance-none" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input class="otp-input w-12 h-14 bg-surface-container-lowest border border-outline-variant text-center font-headline-sm text-headline-sm rounded-lg transition-all focus:ring-0 appearance-none" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input class="otp-input w-12 h-14 bg-surface-container-lowest border border-outline-variant text-center font-headline-sm text-headline-sm rounded-lg transition-all focus:ring-0 appearance-none" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
</div>
<!-- Error Message (Hidden by default) -->

<span class="material-symbols-outlined text-[18px]">error</span>
<span class="font-label-sm text-label-sm">Mã OTP không đúng, thử lại</span>
</div>
<!-- Timer / Resend Section -->
<div class="flex flex-col items-center mt-stack-md space-y-2">
<div class="font-label-md text-label-md text-outline" id="timer-display">
                Gửi lại sau <span id="countdown">60</span>s
            </div>
<button class="hidden font-label-md text-label-md text-primary underline underline-offset-4 active:opacity-60 transition-opacity" id="resend-btn">
                Gửi lại mã
            </button>
</div>
<!-- Atmosphere / Visual Element (Editorial touch) -->

<div class="w-full h-[1px] bg-outline-variant mb-4"></div>

</div>
</main>
<!-- Fixed Action Bottom Area -->
<footer class="p-margin-mobile bg-background">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl active:scale-[0.98] transition-all disabled:opacity-30 disabled:pointer-events-none" id="submit-btn">
            Xác nhận
        </button>
</footer>
<script>
        // Micro-interaction: Auto-focus next input
        const inputs = document.querySelectorAll('.otp-input');
        const submitBtn = document.getElementById('submit-btn');
        const container = document.getElementById('otp-container');
        const errorMessage = document.getElementById('error-message');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                checkInputs();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function checkInputs() {
            const allFilled = Array.from(inputs).every(i => i.value !== '');
            submitBtn.disabled = !allFilled;
            
            // Simulation of error state for demo if they enter "000000"
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code === '000000') {
                container.classList.add('error-state');
                errorMessage.classList.remove('hidden');
            } else {
                container.classList.remove('error-state');
                errorMessage.classList.add('hidden');
            }
        }

        // Countdown Timer Logic
        let seconds = 60;
        const countdownEl = document.getElementById('countdown');
        const timerDisplay = document.getElementById('timer-display');
        const resendBtn = document.getElementById('resend-btn');

        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                timerDisplay.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            }
        }, 1000);

        // Simple vibration/feedback on error
        submitBtn.addEventListener('click', () => {
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code === '000000') {
                container.classList.add('animate-shake');
                setTimeout(() => container.classList.remove('animate-shake'), 400);
            }
        });
    </script>
<style>
        /* Aesthetic Micro-animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Hide number input arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
