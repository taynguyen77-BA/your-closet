<style>

            border-color: #D4B896;

            transition: all 0.2s ease-in-out;

<body class="min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden">

<div class="h-1 w-full bg-[#1A1208]"> <!-- Espresso Track -->

</div>
<!-- Top App Bar Content -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="w-10">
<span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</span>
</div>

<div class="w-10 flex justify-end">
<button class="font-label-sm text-label-sm text-outline hover:opacity-80 transition-opacity">Bỏ qua</button>
</div>
</header>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile flex flex-col">

<img class="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" data-alt="Dynamic and active lifestyle photography showcasing high-performance yet stylish athleisure wear. The model is captured in motion against a sleek, modern architectural backdrop. Clean white and light gray tones dominate the scene, highlighting the technical fabrics and modern sporty design of the garment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyCFRmE54a2to3e49qbGuKa_nWL6cuEKGlLJxZRhitN4AWVMBn5rm_jrhG76icQPDqiaIC-_96wSXLi7T3hw-8MqhjfbHvyXAgbDelIiQbzYyQeDbci_fXTr920iZNdnb7BA4GrfndKphFq_ZW-5jBhqnNJE-fhlTbEqsZUBgesNQj3VhjkYn0bdfX5Ua3swD6MAjm0IZGXFNBYio850Y9w3Li18_zKQXgsVZGSlEiqD-zrJMPWiBg9ern-R939ME4qj-Kyj2nq9M">

</main>
<!-- Fixed Footer Actions -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-md px-margin-mobile py-6 flex justify-between items-center z-50">
<button class="font-label-md text-label-md text-primary px-4 py-3 active:opacity-50 transition-all flex items-center gap-2">
            Quay lại
        </button>
<button class="bg-primary text-on-primary font-label-md text-label-md uppercase tracking-widest px-10 py-3 rounded-sm shadow-sm active:scale-95 transition-transform">
            Tiếp tục
        </button>
</footer>
<script>
        // Micro-interaction for chip selection
        document.querySelectorAll('.option-chip input').forEach(input => {
            input.addEventListener('change', function() {
                const parentDiv = this.nextElementSibling;
                const img = parentDiv.querySelector('img');
                if (this.checked) {
                    parentDiv.classList.add('ring-2', 'ring-secondary-container');
                    img.classList.remove('grayscale');
                    img.classList.add('opacity-100');
                } else {
                    parentDiv.classList.remove('ring-2', 'ring-secondary-container');
                    img.classList.add('grayscale');
                }
            });
        });

        // Simple button scale effect
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('scale-95'));
            btn.addEventListener('touchend', () => btn.classList.remove('scale-95'));
        });
    </script>
