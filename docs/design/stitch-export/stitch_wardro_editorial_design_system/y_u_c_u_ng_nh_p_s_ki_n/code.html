<!DOCTYPE html><html class="light" lang="vi"><head>

<style>
        body {
            background-color: #f9f9f9; /* Linen background as per style guidance */
            color: #1a1c1c;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .linen-texture {
            background-image: url("https://www.transparenttextures.com/patterns/linen-paper.png");
            background-blend-mode: overlay;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="linen-texture min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background dark:bg-background border-b border-outline-variant/20 dark:border-outline/20">
<div class="flex justify-between items-center px-margin-mobile py-unit w-full max-w-container-max mx-auto">
<div class="flex items-center gap-4 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed">Sự kiện</h1>
<div class="flex items-center gap-4 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="shopping_bag">shopping_bag</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-stack-lg">
<!-- Guest-Blocked Component -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg border border-outline-variant/10 shadow-sm p-stack-md text-center flex flex-col items-center">
<!-- Icon Illustration Container -->
<div class="mb-stack-md w-24 h-24 bg-surface-container flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="calendar_today">calendar_today</span>
</div>
<!-- Content -->
<h2 class="font-headline-sm text-headline-sm text-primary mb-stack-sm">
                Đăng nhập để lưu lịch trình
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg max-w-[280px]">
                Sự kiện, dress code và gợi ý outfit theo thời tiết là dữ liệu cá nhân nên cần tài khoản.
            </p>
<!-- Actions -->
<div class="w-full space-y-stack-sm">
<!-- Primary Action: Đăng nhập -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md hover:opacity-90 transition-opacity active:scale-[0.98]">
                    Đăng nhập
                </button>
<!-- Secondary Action: Xem mua sắm gợi ý -->
<button class="w-full bg-secondary-container text-on-secondary-container py-4 rounded-lg font-label-md flex items-center justify-center gap-2 hover:bg-secondary-fixed-dim transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]" data-icon="shopping_bag">shopping_bag</span>
                    Xem mua sắm gợi ý
                </button>
</div>
<!-- Subtle Decorative Visual -->
<div class="mt-stack-lg grid grid-cols-3 gap-2 opacity-20 grayscale pointer-events-none">
<div class="h-20 w-full rounded-lg bg-outline"></div>
<div class="h-20 w-full rounded-lg bg-outline"></div>
<div class="h-20 w-full rounded-lg bg-outline"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface dark:bg-surface-container-high border-t border-outline-variant/10 rounded-t-full shadow-sm">
<!-- Trang chủ -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Trang chủ</span>
</a>
<!-- Tủ đồ -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="checkroom">checkroom</span>
<span class="font-label-sm text-label-sm">Tủ đồ</span>
</a>
<!-- Thử đồ (Thử đồ mapping to architecture/calendar context if relevant, but maintaining label list) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="architecture">architecture</span>
<span class="font-label-sm text-label-sm">Thử đồ</span>
</a>
<!-- Cộng đồng -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-sm text-label-sm">Cộng đồng</span>
</a>
<!-- Cá nhân -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Cá nhân</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        // Simple logic for ripple-like feedback or active states
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', function(e) {
                // Potential future navigation logic
            });
        });

        // Maintain linen background depth on scroll
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm');
            } else {
                header.classList.remove('shadow-sm');
            }
        });
    </script>
</body></html>
